name: CI

on:
  pull_request:
    branches: [main, master]
    paths-ignore: ["docs/**"]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.pre-commit-config.yaml'
            frontend:
              - 'frontend/**'

  backend-lint:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1

  backend-test:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Create env files (gitignored locally, absent in CI)
        # docker-compose.local.yml references these via env_file; even `down` fails to
        # parse the compose model without them. CI-only throwaway values.
        run: |
          mkdir -p .envs/.local ../.envs/.local
          {
            echo "USE_DOCKER=yes"
            echo "IPYTHONDIR=/app/.ipython"
          } > .envs/.local/.django
          {
            echo "POSTGRES_HOST=postgres"
            echo "POSTGRES_PORT=5432"
            echo "POSTGRES_DB=collateral_ai"
            echo "POSTGRES_USER=ci_user"
            echo "POSTGRES_PASSWORD=ci_only_password"
          } > .envs/.local/.postgres
          echo "VITE_API_URL=http://localhost:8000" > ../.envs/.local/.frontend
      - name: Build stack
        run: docker compose -f ../docker-compose.local.yml build django postgres
      - name: Check migrations
        run: docker compose -f ../docker-compose.local.yml run --rm django python manage.py makemigrations --check
      - name: Migrate
        run: docker compose -f ../docker-compose.local.yml run --rm django python manage.py migrate
      - name: Test
        run: docker compose -f ../docker-compose.local.yml run --rm django pytest -n auto
      - name: Tear down
        if: always()
        run: docker compose -f ../docker-compose.local.yml down -v

  frontend-test:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
